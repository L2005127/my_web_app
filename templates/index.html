<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人状态看板</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-gradient-1: #f5f7fa;
            --bg-gradient-2: #c3cfe2;
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent: #5b8def;
            --accent-hover: #4a76d6;
            --accent-gradient-1: #6a9ff5;
            --accent-gradient-2: #5b8def;
            --success: #27ae60;
            --shadow-soft: 0 8px 32px rgba(31, 38, 135, 0.12);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                         "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2));
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 860px;
        }

        /* 顶部标题区 */
        .header {
            text-align: center;
            margin-bottom: 36px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--text-main), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header h1 i {
            -webkit-text-fill-color: var(--accent);
        }

        .header p {
            margin-top: 8px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* 卡片网格 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            padding: 28px 24px;
            text-align: center;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(31, 38, 135, 0.18);
        }

        .card .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gradient-1), var(--accent-gradient-2));
            color: #fff;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(91, 141, 239, 0.35);
        }

        .card .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 1.4rem;
            font-weight: 600;
            word-break: break-word;
        }

        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            margin-right: 8px;
            box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.5);
            animation: pulse 2s infinite;
            vertical-align: middle;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0.5); }
            70% { box-shadow: 0 0 0 12px rgba(39, 174, 96, 0); }
            100% { box-shadow: 0 0 0 0 rgba(39, 174, 96, 0); }
        }

        .status-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--success);
        }

        /* 语录卡片（占满一行） */
        .quote-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            padding: 32px 28px;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
        }

        .quote-card::before {
            content: "\f10d";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 16px;
            left: 20px;
            font-size: 2rem;
            color: rgba(91, 141, 239, 0.2);
        }

        .quote-card .quote-text {
            font-size: 1.15rem;
            line-height: 1.7;
            text-align: center;
            color: var(--text-main);
            min-height: 40px;
            transition: opacity 0.4s ease;
        }

        .quote-card .quote-text.fade {
            opacity: 0;
        }

        /* 刷新按钮 */
        .actions {
            text-align: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 34px;
            font-size: 1rem;
            font-weight: 500;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            background: linear-gradient(135deg, var(--accent-gradient-1), var(--accent-gradient-2));
            box-shadow: 0 10px 24px rgba(91, 141, 239, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(91, 141, 239, 0.5);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn .fa-spinner {
            display: none;
        }

        .btn.loading .fa-spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        .btn.loading .fa-rotate {
            display: none;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 提示信息 */
        .toast {
            text-align: center;
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .toast.show {
            opacity: 1;
        }

        .toast.error {
            color: #e74c3c;
        }

        /* 底部 */
        .footer {
            text-align: center;
            margin-top: 32px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .footer .heart {
            color: #e74c3c;
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.6rem; }
            .grid { grid-template-columns: 1fr; }
            .card .value { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1><i class="fa-solid fa-gauge-high"></i> 个人状态看板</h1>
            <p><i class="fa-solid fa-server"></i> 部署于云端 · FastAPI + Docker</p>
        </div>

        <!-- 状态卡片网格 -->
        <div class="grid">
            <div class="card">
                <div class="icon"><i class="fa-regular fa-clock"></i></div>
                <div class="label">服务器当前时间</div>
                <div class="value" id="server-time">--:--:--</div>
            </div>

            <div class="card">
                <div class="icon"><i class="fa-solid fa-circle-check"></i></div>
                <div class="label">系统运行状态</div>
                <div class="value status-text">
                    <span class="status-dot"></span><span id="system-status">运行中</span>
                </div>
            </div>

            <div class="card">
                <div class="icon"><i class="fa-solid fa-hourglass-half"></i></div>
                <div class="label">服务已运行时长</div>
                <div class="value" id="uptime">-</div>
            </div>
        </div>

        <!-- 语录卡片 -->
        <div class="quote-card">
            <div class="quote-text" id="quote-text">加载中...</div>
        </div>

        <!-- 刷新按钮 -->
        <div class="actions">
            <button class="btn" id="refresh-btn" type="button">
                <i class="fa-solid fa-rotate"></i>
                <i class="fa-solid fa-spinner"></i>
                点击刷新数据
            </button>
        </div>
        <div class="toast" id="toast"></div>

        <!-- 底部 -->
        <div class="footer">
            Powered by <i class="fa-brands fa-python"></i> FastAPI &amp;
            <i class="fa-brands fa-docker"></i> Docker · Made with <span class="heart"><i class="fa-solid fa-heart"></i></span>
        </div>
    </div>

    <script>
        // DOM 元素
        const timeEl = document.getElementById('server-time');
        const systemStatusEl = document.getElementById('system-status');
        const uptimeEl = document.getElementById('uptime');
        const quoteEl = document.getElementById('quote-text');
        const refreshBtn = document.getElementById('refresh-btn');
        const toastEl = document.getElementById('toast');

        // 页面加载时初始化数据
        document.addEventListener('DOMContentLoaded', () => {
            loadStatus();
        });

        // 点击刷新按钮：Ajax 局部更新
        refreshBtn.addEventListener('click', () => {
            loadStatus();
        });

        /**
         * 通过 Ajax 调用 /api/status 并局部刷新页面内容。
         */
        async function loadStatus() {
            setLoading(true);
            showToast('正在刷新数据...', false);
            try {
                const response = await fetch('/api/status');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();

                // 记录本地时钟与服务器时间的偏差，用于 JS 动态走秒
                initClockOffset(data.datetime);
                // 更新界面内容
                timeEl.textContent = data.datetime;
                systemStatusEl.textContent = data.system_status;
                uptimeEl.textContent = formatUptime(data.uptime_seconds);
                updateQuote(data.quote);

                showToast('数据已刷新 ✔', false);
            } catch (error) {
                console.error('刷新失败：', error);
                showToast('刷新失败，请检查网络或服务状态。', true);
            } finally {
                setLoading(false);
            }
        }

        /**
         * 通过 JS 每秒动态刷新服务器时间显示。
         * 基准时间为最后一次接口返回的时间戳，本地推进秒数。
         */
        const baseTimeRef = { datetime: '', offset: 0 };
        setInterval(() => {
            if (!timeEl.textContent.includes('--')) {
                const now = new Date(Date.now() + baseTimeRef.offset);
                timeEl.textContent = formatDateTime(now);
            }
        }, 1000);

        // 记录本地时钟与服务器时间的偏差
        function initClockOffset(serverDatetimeStr) {
            const server = new Date(serverDatetimeStr.replace(' ', 'T'));
            baseTimeRef.offset = server.getTime() - Date.now();
        }

        function formatDateTime(date) {
            const pad = (n) => String(n).padStart(2, '0');
            return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ` +
                   `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
        }

        // 将秒数格式化为 天/时/分/秒
        function formatUptime(seconds) {
            const d = Math.floor(seconds / 86400);
            const h = Math.floor((seconds % 86400) / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = seconds % 60;
            const pad = (n) => String(n).padStart(2, '0');
            if (d > 0) return `${d} 天 ${pad(h)} 时 ${pad(m)} 分 ${pad(s)} 秒`;
            if (h > 0) return `${h} 时 ${pad(m)} 分 ${pad(s)} 秒`;
            if (m > 0) return `${m} 分 ${pad(s)} 秒`;
            return `${s} 秒`;
        }

        // 更新语录（带淡出淡入动画）
        function updateQuote(text) {
            quoteEl.classList.add('fade');
            setTimeout(() => {
                quoteEl.textContent = text;
                quoteEl.classList.remove('fade');
            }, 200);
        }

        // 按钮 loading 状态
        function setLoading(loading) {
            if (loading) {
                refreshBtn.classList.add('loading');
                refreshBtn.disabled = true;
            } else {
                refreshBtn.classList.remove('loading');
                refreshBtn.disabled = false;
            }
        }

        // 提示信息
        let toastTimer = null;
        function showToast(message, isError) {
            toastEl.textContent = message;
            toastEl.className = 'toast show' + (isError ? ' error' : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.className = 'toast';
            }, 2500);
        }
    </script>
</body>
</html>
